<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/dist/"><title>MooMoo 的东岸小假期 · 试听</title><link rel="stylesheet" href="style.css"><style>main{max-width:900px;padding:35px;margin:auto}h1{margin-bottom:15px}.music-player{margin-top:22px;flex-wrap:wrap}.cover{width:100%;border-radius:12px;margin:15px 0}p{line-height:1.8;color:#647369}select{padding:8px;margin:12px;font:inherit}</style><main><h1>《MooMoo 的东岸小假期》</h1><p>88 BPM · 两分钟原创合成试听版<br>轻爵士与公路旅行民谣：钢琴、木吉他、低音、刷鼓与一点簧管。</p><label>试听主题<select id="theme"><option value="east-coast">美国东海岸</option><option value="japan">日本东海道</option></select></label><section class="music-player" aria-label="背景音乐"><span class="music-icon">♫</span><div class="music-copy"><strong></strong><span id="music-status"></span></div><button id="music-toggle" aria-pressed="false">▷ 播放音乐</button><label class="volume">音量<input id="music-volume" type="range" min="0" max="100" value="20" aria-label="音乐音量"><output id="music-volume-value">20%</output></label><audio id="background-music" src="assets/sakura-pawprints.wav" preload="metadata" loop></audio></section><img class="cover" src="map-packs/east-coast/assets/v2/01-boston-newport.webp" alt="MooMoo 的新英格兰旅行地图"><p>此试听页使用游戏的音乐播放器，不读取或修改旅行存档。</p><script type="module">import{initMusic}from'./music.js';import{getMapPack}from'./map-content.js';const music=initMusic(),theme=document.querySelector('#theme');const sync=()=>music.setTrack(getMapPack(theme.value).music);theme.addEventListener('change',sync);sync();</script></main></html>
