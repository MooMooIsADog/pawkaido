<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/dist/"><title>地图弯道排版检查</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="map.css"><style>main{max-width:1000px;margin:20px auto;padding:0 12px}header{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-bottom:12px}h1{font-size:20px}select{font:inherit;padding:8px}p{font-size:12px;color:#526458}</style><body data-map-pack="east-coast"><main><header><h1>东海岸 · 弯道与地点名称检查</h1><select aria-label="检查章节"></select><button id="walk-check">试走全程</button><output id="walk-status"></output></header><div id="route" class="route-board"></div><p>本地美术检查页：使用游戏的地图、路线和地点样式，不读取或写入游戏存档。</p></main><script type="module">
import {setMapPack,themeText} from './map-content.js';
import {mapMarkup,mapPoints} from './map.js';
import {walkOnMap} from './walk.js';
import {BOARD,INNS,TYPES,DOGS} from './data.js';
const pack=setMapPack('east-coast'),select=document.querySelector('select');
select.innerHTML=pack.regions.map((r,i)=>`<option value="${i}">${i+1}. ${r.name}</option>`).join('');
function render(){const leg=Number(select.value),start=INNS[leg],end=INNS[leg+1],points=mapPoints(leg,end-start+1);
const buttons=BOARD.slice(start,end+1).map((b,i)=>`<button class="stop available ${b.type==='inn'?'inn':''}" data-id="${b.id}" style="--map-left:${points[i][0]}%;--map-top:${points[i][1]}%" aria-label="${b.id} ${themeText(b.name)}"><span class="number">${b.id}</span><span class="capacity">${b.capacity===4?'⌂':b.capacity===2?'●○':'●'}</span><span class="stop-icon">${themeText(TYPES[b.type].icon)}</span><strong class="stop-name">${b.type==='inn'?themeText(b.name).split(' · ')[1]:themeText(b.name)}</strong></button>`).join('');
document.querySelector('#route').innerHTML=mapMarkup(leg,points,buttons,0);}
select.addEventListener('change',render);render();
document.querySelector('#walk-check').addEventListener('click',async()=>{
 const button=document.querySelector('#walk-check'),status=document.querySelector('#walk-status'),leg=Number(select.value);button.disabled=true;select.disabled=true;status.textContent='沿路散步中';
 let frame=0;const animateSprites=()=>document.querySelectorAll('.walking-dog .sprite').forEach(el=>el.style.backgroundPosition=`${frame%8/7*100}% ${Number(el.dataset.row)/10*100}%`);
 const timer=setInterval(()=>{frame++;animateSprites();},150);
 try{await walkOnMap({dog:0,from:INNS[leg],to:INNS[leg+1],leg,fast:false,sprite:(id,row)=>`<div class="sprite" data-dog="${id}" data-row="${row}" style="background-image:url(assets/${DOGS[id].file}.png)"></div>`,animateSprites});status.textContent='沿路抵达终点';}finally{clearInterval(timer);button.disabled=false;select.disabled=false;}
});
</script></body></html>
